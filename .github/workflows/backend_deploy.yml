name: Deploy Backend to Azure Web App

on:
  push:
    branches:
      - main
    # paths:
    #   - 'backend_webapp/**'  
    #   - '.github/workflows/backend-deploy.yml' # 🔥 only trigger when backend changes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 🔍 Debug (optional but useful)
      - name: Debug - List files
        run: ls -R

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ✅ Install dependencies (NO cd needed)
      - name: Install dependencies
        working-directory: backend_webapp
        run: pip install -r requirements.txt

      # ✅ Zip artifact
      - name: Zip artifact
        working-directory: backend_webapp
        run: zip -r release.zip .

      # ✅ Deploy
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: dev-todoapp-backend-web-lav
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: backend_webapp/release.zip